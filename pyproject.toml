[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "youtube-livestream-processor"
version = "0.1.0"
description = "Distributed system for automated processing of hardware livestreams with MCP server support"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "cachetools>=5.5.0",
    "certifi>=2025.7.0",
    "charset-normalizer>=3.4.0",
    "filelock>=3.0.0",
    "google-api-core>=2.25.0",
    "google-api-python-client>=2.177.0",
    "google-auth>=2.40.0",
    "google-auth-httplib2>=0.2.0",
    "googleapis-common-protos>=1.70.0",
    "greenlet>=3.2.0",
    "httplib2>=0.22.0",
    "idna>=3.10",
    "mcp>=1.9.0",
    "playwright>=1.54.0",
    "proto-plus>=1.26.0",
    "protobuf>=6.31.0",
    "pyasn1>=0.6.0",
    "pyasn1-modules>=0.4.0",
    "pyee>=13.0.0",
    "pyotp>=2.9.0",
    "pyparsing>=3.2.0",
    "requests>=2.32.0",
    "rsa>=4.9.0",
    "typing-extensions>=4.14.0",
    "uritemplate>=4.2.0",
    "urllib3>=2.5.0",
    "yt-dlp>=2025.9.26",
]

[project.scripts]
youtube-download-mcp = "youtube_download_mcp:mcp.run"

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
]
